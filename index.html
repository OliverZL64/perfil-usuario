<!DOCTYPE html> 
<html lang="es"> 
<head> 
    <meta charset="UTF-8"> 
    <meta name="viewport" content="width=device-width, initial-scale=1.0"> 
    <title>Perfil de Usuario</title> 
    <link rel="stylesheet" href="styles.css"> 
</head> 
<body> 
    <div class="container"> 
        <h1>Crear Perfil de Usuario</h1> 
        <form action="procesar.php" method="POST"> 
            <label for="nombre">Nombre:</label> 
            <input type="text" id="nombre" name="nombre" required> 

            <label for="edad">Edad:</label> 
            <input type="number" id="edad" name="edad" required> 

            <label for="email">Correo Electrónico:</label>
            <input type="email" id="email" name="email" required>

            <label for="telefono">Número de Teléfono:</label>
            <input type="tel" id="telefono" name="telefono" pattern="[0-9]{10}" required>

            <label for="fecha_nacimiento">Fecha de Nacimiento:</label>
            <input type="date" id="fecha_nacimiento" name="fecha_nacimiento" required>

            <label for="experiencia">Nivel de experiencia en tecnología:</label> 
            <select id="experiencia" name="experiencia"> 
                <option value="nulo">nulo</option>
                <option value="Principiante">Principiante</option> 
                <option value="Intermedio">Intermedio</option> 
                <option value="Avanzado">Avanzado</option> 
            </select> 
            <button type="submit">Guardar Perfil</button> 
        </form> 
    </div> 
    <img src="qr_perfil_usuario.png" alt="Código QR para acceder al sitio" class="qr">
</body> 
</html>
